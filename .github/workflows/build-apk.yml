name: Build & Release Android APKs (arm64-v8a & x86_64)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    name: Build & Release Standalone Debug APKs (arm64-v8a & x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Extra Duplicate APKs & Personal Screenshots from Repository
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          REMOVED=0
          for extra_file in \
            apk/app-*.apk \
            apk/GlanceFiles-debug.apk \
            public/assets/aistudio/Screenshot_20261112-204137_Moto_App_Launcher_ff19b288.png \
            public/assets/aistudio/Screenshot_20261112-212857_Moto_App_Launcher_bdcaf432.png; do
            if [ -e "$extra_file" ]; then
              git rm -f --ignore-unmatch "$extra_file"
              REMOVED=1
            fi
          done
          if [ "$REMOVED" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: remove duplicate APKs and personal screenshots [skip ci]" || true
            git push || true
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (v4)
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle (v4)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Standalone arm64-v8a & x86_64 Debug APKs
        run: |
          gradle assembleDebug -PenableAbiSplits=true --no-daemon
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-assets/GlanceFiles-arm64-v8a-debug.apk
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk release-assets/GlanceFiles-x86_64-debug.apk

      - name: Upload Standalone arm64-v8a APK Artifact (v4)
        uses: actions/upload-artifact@v4
        with:
          name: GlanceFiles-arm64-v8a-debug-apk
          path: release-assets/GlanceFiles-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Standalone x86_64 APK Artifact (v4)
        uses: actions/upload-artifact@v4
        with:
          name: GlanceFiles-x86_64-debug-apk
          path: release-assets/GlanceFiles-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Both Debug APKs to GitHub Releases / Assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi
          RELEASE_TITLE="Glance Files ${TAG_NAME} (arm64-v8a & x86_64)"
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" \
              release-assets/GlanceFiles-arm64-v8a-debug.apk \
              release-assets/GlanceFiles-x86_64-debug.apk \
              --clobber
          else
            gh release create "${TAG_NAME}" \
              release-assets/GlanceFiles-arm64-v8a-debug.apk \
              release-assets/GlanceFiles-x86_64-debug.apk \
              --title "${RELEASE_TITLE}" \
              --notes "Standalone Debug APKs built automatically by GitHub Actions:
          - **GlanceFiles-arm64-v8a-debug.apk** (ARM64 phones/tablets)
          - **GlanceFiles-x86_64-debug.apk** (x86_64 emulators/devices)" \
              --latest
          fi
