name: Build Android APK (arm64-v8a & x86_64)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    name: Build Standalone APKs (arm64-v8a & x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (v4)
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle (v4)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Standalone arm64-v8a & x86_64 APKs
        run: gradle assembleDebug -PenableAbiSplits=true --no-daemon

      - name: Upload Standalone arm64-v8a APK (v4)
        uses: actions/upload-artifact@v4
        with:
          name: GlanceFiles-arm64-v8a-apk
          path: |
            apk/GlanceFiles-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Standalone x86_64 APK (v4)
        uses: actions/upload-artifact@v4
        with:
          name: GlanceFiles-x86_64-apk
          path: |
            apk/GlanceFiles-x86_64-debug.apk
            app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 30
